name: apply-matching-reference-fixes

on:
  push:
    branches:
      - agent/exact-model-color-funnel

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply fixes
        run: python tools/apply_matching_reference_fixes.py
      - name: Validate syntax
        run: python -m py_compile app/services/model_selection.py app/services/price_service.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/model_selection.py app/services/price_service.py
          git commit -m "Separate query context from matching reference"
          git push
