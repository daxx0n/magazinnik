name: finalize-handler-hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply final cleanup
        run: python tools/finalize_handler_hardening.py
      - name: Fix generated text and duplicate diagnostics keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/handlers/search.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            f"Предложения не найдены.\n\n{error}"\n',
              '            f"Предложения не найдены.\\n\\n{error}"\n',
          )
          text = text.replace(
              '            "для выбранной модели.\n"\n',
              '            "для выбранной модели.\\n"\n',
          )
          duplicate = '        "color_unknown": "цвет не указан",\n'
          while duplicate + duplicate in text:
              text = text.replace(duplicate + duplicate, duplicate)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate syntax
        id: syntax
        shell: bash
        run: |
          set +e
          python -m py_compile app/handlers/search.py app/services/search_sessions.py > syntax-output.txt 2>&1
          status=$?
          cat syntax-output.txt
          exit $status
      - name: Upload syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-handler-syntax
          path: syntax-output.txt
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/handlers/search.py app/services/search_sessions.py
          git commit -m "Finalize session isolation and coalesced history writes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
