name: finalize-handler-hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply final cleanup
        run: python tools/finalize_handler_hardening.py
      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/search_sessions.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/handlers/search.py app/services/search_sessions.py
          git commit -m "Finalize session isolation and coalesced history writes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
