name: apply-final-fuzz-fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply fixes
        run: python tools/apply_final_fuzz_fixes.py
      - name: Validate syntax
        run: python -m py_compile app/services/model_selection.py app/services/price_service.py app/services/sqlite_catalog_storage.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/model_selection.py app/services/price_service.py app/services/sqlite_catalog_storage.py
          git commit -m "Fix matcher suffixes, console configuration and SQLite resources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
