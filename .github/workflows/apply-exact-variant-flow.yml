name: apply-exact-variant-flow

on:
  push:
    branches:
      - agent/exact-model-color-funnel

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/apply_exact_variant_flow.py
      - name: Validate patch
        run: git diff --check
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/handlers/search.py app/services/price_service.py
          git commit -m "Apply exact model and color selection flow"
          git push
