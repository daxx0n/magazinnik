name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Run live phone cross-source matrix
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/live_phone_cross_source_matrix.py > matrix-output.txt 2>&1
          echo $? > matrix-status.txt
          exit 0

      - name: Upload live matrix output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-phone-matrix
          path: |
            matrix-output.txt
            matrix-status.txt

      - name: Propagate matrix status
        shell: bash
        run: exit "$(cat matrix-status.txt)"
