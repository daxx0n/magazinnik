name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > test-output.txt 2>&1
          echo $? > test-status.txt
          exit 0

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-unittest-output
          path: |
            test-output.txt
            test-status.txt

      - name: Propagate test status
        shell: bash
        run: exit "$(cat test-status.txt)"
