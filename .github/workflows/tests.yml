name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live Mini versus Light check
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/live_station_mini_light_check.py > live-result.json 2>&1
          status=$?
          cat live-result.json
          echo "$status" > live-status.txt
          exit 0

      - name: Upload live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-mini-light-live
          path: |
            live-result.json
            live-status.txt

      - name: Propagate live status
        run: exit "$(cat live-status.txt)"
