name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print public Onliner search titles
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({"query": "Huawei nova Y63 6 128GB", "page": "1"})
          request = urllib.request.Request(
              "https://www.onliner.by/sdapi/catalog.api/search/products?" + params,
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              data = json.load(response)
          for product in data.get("products", []):
              print("PRODUCT", json.dumps({
                  "key": product.get("key"),
                  "name": product.get("name"),
                  "full_name": product.get("full_name"),
                  "html_url": product.get("html_url"),
              }, ensure_ascii=False))
          PY
