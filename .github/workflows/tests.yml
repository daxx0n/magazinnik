name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused live 21vek verification
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/live_21vek_43nu900_check.py > live-21vek-output.json 2>&1
          echo $? > live-21vek-status.txt
          exit 0

      - name: Upload live 21vek output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-21vek-43nu900-final
          path: |
            live-21vek-output.json
            live-21vek-status.txt

      - name: Propagate live verification status
        shell: bash
        run: exit "$(cat live-21vek-status.txt)"
