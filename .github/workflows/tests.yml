name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print public 21vek search titles
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({"term": "Huawei nova Y63 6 128GB"})
          request = urllib.request.Request(
              "https://www.21vek.by/search/?" + query,
              headers={"User-Agent": "Mozilla/5.0", "Accept-Language": "ru-RU,ru;q=0.9"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              html = response.read().decode("utf-8", errors="replace")
          match = re.search(
              r'<script[^>]+id="__NEXT_DATA__"[^>]*>(.*?)</script>',
              html,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("NEXT_DATA_NOT_FOUND")
          next_data = json.loads(match.group(1))
          initial_state = json.loads(next_data["props"]["pageProps"]["initialState"])
          products = initial_state["searchResult"]["products"]["all"]
          for product in products:
              print("PRODUCT", json.dumps({
                  "name": product.get("name"),
                  "link": product.get("link"),
                  "status": product.get("status"),
              }, ensure_ascii=False))
          PY
