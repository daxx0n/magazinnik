name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply eSIM compatibility fix
        run: PYTHONPATH=. python scripts/fix_model_version_esim.py

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > test-output.txt 2>&1
          status=$?
          tail -n 200 test-output.txt
          exit $status

      - name: Commit eSIM compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/model_selection.py
          if git diff --cached --quiet; then
            echo "Fix already applied"
            exit 0
          fi
          git commit -m "Preserve eSIM matching with model-tier aliases"
          git push origin HEAD:${{ github.head_ref }}
