name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Correct migration target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_preproduction_hardening.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        "        query = self._catalog_queries.get(product_key, product.title)\\n",\n        "        query = original_query or self._catalog_queries.get(\\n            product_key,\\n            product.title,\\n        )\\n",',
              '        "        original_query = self._catalog_queries.get(product_key, product.title)\\n",\n        "        original_query = original_query or self._catalog_queries.get(\\n            product_key,\\n            product.title,\\n        )\\n",',
          )
          text = text.replace(
              '                    original_query=query,',
              '                    original_query=original_query,',
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply hardening patch
        id: migration
        shell: bash
        run: |
          set +e
          {
            python tools/apply_preproduction_hardening.py
            python tools/apply_preproduction_fixes.py
          } > migration-output.txt 2>&1
          status=$?
          cat migration-output.txt
          exit $status

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-output
          path: migration-output.txt

      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/catalog_service.py app/services/catalog_first_search.py app/services/price_service.py app/services/price_history.py app/services/search_input.py app/services/search_load.py app/services/search_sessions.py

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: verified-hardening-files
          path: |
            app/handlers/search.py
            app/services/catalog_service.py
            app/services/catalog_first_search.py
            app/services/price_service.py
            app/services/price_history.py

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > test-output.txt 2>&1
          status=$?
          tail -n 200 test-output.txt
          exit $status

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
