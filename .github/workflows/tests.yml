name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live Zeon QNED verification
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/live_zeon_qned_check.py > zeon-qned-output.txt 2>&1
          echo $? > zeon-qned-status.txt
          exit 0

      - name: Upload live Zeon QNED output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-zeon-qned
          path: |
            zeon-qned-output.txt
            zeon-qned-status.txt

      - name: Propagate live verification status
        shell: bash
        run: exit "$(cat zeon-qned-status.txt)"
