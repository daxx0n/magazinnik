name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live Station Light diagnostic
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/live_station_light_sources.py > station-light-output.json 2>&1
          echo $? > station-light-status.txt
          exit 0

      - name: Upload Station Light diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-light-source-diagnostic
          path: |
            station-light-output.json
            station-light-status.txt

      - name: Propagate diagnostic status
        shell: bash
        run: exit "$(cat station-light-status.txt)"
