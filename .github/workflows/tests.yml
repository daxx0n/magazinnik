name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Zeon diagnostic
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/diagnose_zeon_tv.py > zeon-diagnostic.json 2>&1
          echo $? > zeon-status.txt
          exit 0

      - name: Upload Zeon diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeon-tv-diagnostic-fixed
          path: |
            zeon-diagnostic.json
            zeon-status.txt

      - name: Propagate diagnostic status
        shell: bash
        run: exit "$(cat zeon-status.txt)"
