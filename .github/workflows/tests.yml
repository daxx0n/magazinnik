name: tests

on:
  push:
    branches:
      - main
      - agent/product-master-catalog
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply hardening patch
        run: python tools/apply_preproduction_hardening.py

      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/catalog_service.py app/services/catalog_first_search.py app/services/price_service.py app/services/search_input.py app/services/search_load.py app/services/search_sessions.py

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: verified-hardening-files
          path: |
            app/handlers/search.py
            app/services/catalog_service.py
            app/services/catalog_first_search.py
            app/services/price_service.py

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > test-output.txt 2>&1
          status=$?
          tail -n 160 test-output.txt
          exit $status
