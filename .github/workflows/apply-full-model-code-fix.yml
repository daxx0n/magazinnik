name: apply full model code fix

on:
  push:
    branches:
      - agent/fix-zeon-full-model-codes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-zeon-full-model-codes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply patch
        run: python scripts/apply_full_model_code_fix.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strict full model code matching"
          git push origin HEAD:agent/fix-zeon-full-model-codes
