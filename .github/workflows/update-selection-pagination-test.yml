name: update-selection-pagination-test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/update_pagination_test.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_statuses.py
          git commit -m "Update pagination test for memory selection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: python -m unittest tests.test_source_statuses.SourceStatusesTest.test_paginates_product_variants
