name: update-selection-pagination-test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run focused test
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_source_statuses.SourceStatusesTest.test_paginates_product_variants > focused-output.txt 2>&1
          status=$?
          cat focused-output.txt
          exit $status
      - name: Upload focused output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-pagination-output
          path: focused-output.txt
