name: contextual-color-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_contextual_color_grouping -v > contextual-output.txt 2>&1
          status=$?
          cat contextual-output.txt
          exit $status
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextual-color-output
          path: contextual-output.txt
