name: apply-device-memory-color-flow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply flow
        run: python tools/apply_device_memory_color_flow.py
      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/selection_flow.py
      - name: Commit flow
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/handlers/search.py
          git commit -m "Implement device memory color selection flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
