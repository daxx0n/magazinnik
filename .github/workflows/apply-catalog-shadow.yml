name: apply catalog shadow integration

on:
  push:
    branches:
      - agent/product-master-catalog
    paths:
      - .github/workflows/apply-catalog-shadow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/product-master-catalog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply focused migration
        run: python scripts/apply_catalog_shadow.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/price_service.py tests/test_price_service_catalog.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate master catalog shadow mode"
          git push origin HEAD:agent/product-master-catalog
