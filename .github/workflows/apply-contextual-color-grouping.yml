name: apply-contextual-color-grouping

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_contextual_color_grouping.py
      - run: python -m py_compile app/services/model_selection.py
      - name: Commit product patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/model_selection.py
          git commit -m "Fix contextual color grouping"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
