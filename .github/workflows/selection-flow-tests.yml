name: selection-flow-tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > selection-test-output.txt 2>&1
          status=$?
          tail -n 200 selection-test-output.txt
          exit $status
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-test-output
          path: selection-test-output.txt
