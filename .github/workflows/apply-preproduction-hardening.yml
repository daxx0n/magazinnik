name: apply-preproduction-hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize hardening implementation
        run: python tools/cleanup_preproduction_hardening.py
      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/catalog_service.py app/services/catalog_first_search.py app/services/price_service.py app/services/price_history.py app/services/search_input.py app/services/search_load.py app/services/search_sessions.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/catalog_service.py app/services/price_service.py app/services/price_history.py
          git commit -m "Normalize load hardening and close SQLite resources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
