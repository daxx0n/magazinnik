name: apply-preproduction-hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Correct migration target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_preproduction_hardening.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        "        query = self._catalog_queries.get(product_key, product.title)\\n",\n        "        query = original_query or self._catalog_queries.get(\\n            product_key,\\n            product.title,\\n        )\\n",',
              '        "        original_query = self._catalog_queries.get(product_key, product.title)\\n",\n        "        original_query = original_query or self._catalog_queries.get(\\n            product_key,\\n            product.title,\\n        )\\n",',
          )
          text = text.replace(
              '                    original_query=query,',
              '                    original_query=original_query,',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply hardening
        run: python tools/apply_preproduction_hardening.py
      - name: Validate syntax
        run: python -m py_compile app/handlers/search.py app/services/catalog_service.py app/services/catalog_first_search.py app/services/price_service.py app/services/search_input.py app/services/search_load.py app/services/search_sessions.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/handlers/search.py app/services/catalog_service.py app/services/catalog_first_search.py app/services/price_service.py
          git commit -m "Apply preproduction load hardening"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
